[project]
name = "job-radar"
version = "0.1.0"
description = "Finds remote AI Integration jobs that fit your profile, explains the match, and drafts your application."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
job-radar = "job_radar.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_radar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
